<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="LastPlate: an AI agent that rescues surplus food before it spoils.">
<meta name="theme-color" content="#061418">
<link rel="icon" href="data:,">
<title>LastPlate: food rescue before the clock runs out</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="f-cooked" viewBox="0 0 48 48"><path d="M6 22h36a18 18 0 0 1-36 0z" fill="#FFB02E"/><path d="M14 18c0-4 4-4 4-8M24 18c0-4 4-4 4-8M32 18c0-4 4-4 4-8" stroke="#F6EEDF" stroke-width="2" fill="none" stroke-linecap="round"/><rect x="14" y="40" width="20" height="3" rx="1.5" fill="#C77F12"/></symbol>
<symbol id="f-bakery" viewBox="0 0 48 48"><path d="M8 28c-2-10 6-16 16-16s18 6 16 16c0 4-2 8-4 8H12c-2 0-4-4-4-8z" fill="#E0A458"/><path d="M16 20l4 8M24 18l4 9M32 20l3 7" stroke="#B9783A" stroke-width="2.5" stroke-linecap="round"/></symbol>
<symbol id="f-produce" viewBox="0 0 48 48"><path d="M6 26h36a18 15 0 0 1-36 0z" fill="#2E8F7A"/><circle cx="16" cy="22" r="7" fill="#5EE0A0"/><circle cx="27" cy="19" r="8" fill="#3DBE7C"/><circle cx="34" cy="24" r="5" fill="#FF5B49"/></symbol>
<symbol id="f-dairy" viewBox="0 0 48 48"><path d="M16 8h16l4 8v26H12V16z" fill="#F6EEDF"/><rect x="12" y="22" width="24" height="12" fill="#5EE0E0"/><path d="M16 8l-4 8h24l-4-8z" fill="#9FC9CF"/></symbol>
<symbol id="f-packaged" viewBox="0 0 48 48"><rect x="8" y="14" width="32" height="26" rx="3" fill="#C99A5B"/><path d="M8 22h32M20 14v8" stroke="#8A6330" stroke-width="2.5"/></symbol>
<symbol id="f-apple" viewBox="0 0 48 48"><circle cx="24" cy="28" r="14" fill="#FF5B49"/><path d="M24 14c0-5 4-7 7-7" stroke="#5EE0A0" stroke-width="3" fill="none"/></symbol>
</defs></svg>
<div class="fl" id="fl" aria-hidden="true">
<svg class="f" style="left:6%;top:18%" viewBox="0 0 48 48"><use href="#f-cooked"/></svg>
<svg class="f" style="left:88%;top:12%;animation-delay:-3s" viewBox="0 0 48 48"><use href="#f-bakery"/></svg>
<svg class="f" style="left:93%;top:60%;animation-delay:-5s" viewBox="0 0 48 48"><use href="#f-apple"/></svg>
<svg class="f" style="left:3%;top:68%;animation-delay:-2s" viewBox="0 0 48 48"><use href="#f-dairy"/></svg>
<svg class="f" style="left:48%;top:88%;animation-delay:-6s" viewBox="0 0 48 48"><use href="#f-produce"/></svg>
</div>
<div id="wash" aria-hidden="true"><svg viewBox="0 0 80 80"><path d="M18 42l15 15 30-32"/></svg></div>
<header class="top" id="top">
  <div><h1>LastPlate</h1><p>Food is a ticking clock. We move it before it spoils.</p></div>
  <div id="badges" class="badges"></div>
</header>
<section class="tiles" id="tiles" aria-label="Key features">
  <button class="tile" aria-expanded="false"><i class="g1"></i><b>Freshness Clock</b><span>Every donation has a live countdown. Its color shows how urgent it is.</span></button>
  <button class="tile" aria-expanded="false"><i class="g2"></i><b>Instant replan</b><span>A recipient cancels and the next best one is chosen in milliseconds.</span></button>
  <button class="tile" aria-expanded="false"><i class="g3"></i><b>Human confirmation</b><span>A person confirms food safety and the handoff. The server enforces it.</span></button>
  <button class="tile" aria-expanded="false"><i class="g4"></i><b>Tripwire security</b><span>Decoy tools catch hijacked agents. Try a note that says "ignore previous instructions".</span></button>
</section>
<main class="board">
  <aside class="queue" aria-label="Donations">
    <div class="qh"><h2>Donations</h2><button id="new" class="ghost">New donation</button></div>
    <ul id="queue"></ul>
    <section id="metrics" class="metrics"></section>
  </aside>
  <section id="stage" class="stage" aria-live="polite"></section>
  <aside class="rail" aria-label="Security log">
    <div class="qh"><h2>Security log</h2><button id="verify" class="ghost">Verify log</button></div>
    <ol id="audit"></ol>
  </aside>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
